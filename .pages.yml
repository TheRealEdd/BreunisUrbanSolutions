media:
  input: media/blog
  output: /media/blog

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Post Title
        type: string
        required: true
      - name: cover
        label: Cover Image
        type: image
        options:
          media: images
          path: media/blog
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: description
        label: Short Summary
        type: text
      - name: body
        label: Blog Content
        type: rich-text
        required: true