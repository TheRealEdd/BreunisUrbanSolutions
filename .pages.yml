media:
  input: media/blog
  output: /media/blog

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Blog titel
        type: string
        required: true
      - name: cover
        label: Blog foto
        type: image
        required: true
      - name: cover_image_alt
        label: Blog foto beschrijving
        type: string
      - name: date
        label: Datum gepubliceerd
        type: date
        required: true
      - name: description
        label: Blog beschrijving (kort)
        type: text
      - name: body
        label: Blog (lang)
        type: rich-text
        required: true
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Post Title
        type: string
        required: true
      - name: cover
        label: Cover Image
        type: image
        required: true
      - name: cover_image_alt
        label: Cover Image Alt Text
        type: string
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: description
        label: Short Summary
        type: text
      - name: body
        label: Blog Content
        type: rich-text
        required: true