media:
  input: "media/blog"
  output: "/media/blog"

content:
  - name: "posts"
    label: "Blog Posts"
    type: "collection"
    path: "_posts"
    filename: "{year}-{month}-{day}-{slug}"
    extension: "md"
    format: "frontmatter-markdown"
    fields:
      - name: "title"
        label: "Post Titel"
        type: "string"
        required: true
      - name: "date"
        label: "Post Datum"
        type: "date"
        required: true
      - name: "layout"
        label: "Layout"
        type: "hidden"
        default: "post"
      - name: "description"
        label: "Omschrijving"
        type: "text"
      - name: "body"
        label: "Blog Content"
        type: "rich-text"
        required: true