---
layout: default
title: Our Blog
---

<header>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html"><img src="./media/BUS-logo.svg" alt="BUS Logo" class="logo"></a>
    </div>

    <ul class="nav-links">
      <li><a href="#projecten">Projecten</a></li>
      <li><a href="{{ site.baseurl }}/blog.html">Blog</a></li>
      <li><a href="#over-bus">Over BUS</a></li>
      <li><a href="#contacty" id="nav-contact-btn">Contact</a></li>
    </ul>
  </nav>
</header>

<h1>Welcome to the Blog</h1>

<!-- This is the loop that Jekyll uses to automatically list your posts -->
<ul class="blog-list">
  {% for post in site.posts %}
  <li>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-date">{{ post.date | date: "%B %d, %Y" }}</p>
    <p>{{ post.description }}</p>
  </li>
  {% endfor %}
</ul>
