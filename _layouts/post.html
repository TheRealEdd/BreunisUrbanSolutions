<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Post</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/styles.css"> 
    <!-- We load a tiny tool called Marked to convert Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <main class="post-content">

        <h1>{{ page.title }}</h1>

        <p class="post-date">
            {{ page.date | date: "%B %d, %Y" }}
        </p>

        <div class="entry-content">
            {{ content | replace: 'src="/media/', 'src="' | replace: 'src="', 'src="' | prepend: site.baseurl | replace: 'src="', 'src="/media/' }}
        </div>

    </main>
</body>
</html>
