<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Post</title>
    <!-- We load a tiny tool called Marked to convert Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Your standard website styling goes here */
        .blog-container { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        .blog-container img { max-width: 100%; height: auto; } /* Keeps images from breaking layout */
    </style>
</head>
<body>

    <main class="post-content">

        <h1>{{ page.title }}</h1>

        <p class="post-date">
            {{ page.date | date: "%B %d, %Y" }}
        </p>

        {{ content }}

    </main>
</body>
</html>
